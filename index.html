<!DOCTYPE html>
<html lang="es">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1">
<title>El Decisor</title>
<link rel="preconnect" href="https://fonts.googleapis.com">
<link href="https://fonts.googleapis.com/css2?family=Playfair+Display:ital,wght@0,600;1,600&family=Quicksand:wght@500;600;700&display=swap" rel="stylesheet">
<style>
  *{ box-sizing:border-box; -webkit-tap-highlight-color:transparent; }

  :root{
    --ink-deep:#062a44;
    --ink-violet:#0f5c8c;
    --ink-violet-2:#3aa7d9;
    --gold:#f5b942;
    --rose:#8fe0ff;
    --starlight:#f2fbff;
    --red:#ff5a6e;
  }

  html,body{
    margin:0; padding:0; min-height:100%;
    background: radial-gradient(ellipse at 50% 15%, var(--ink-violet-2) 0%, var(--ink-violet) 45%, var(--ink-deep) 100%);
    font-family:'Quicksand', sans-serif;
    color:var(--starlight);
  }

  #stars{ position:fixed; inset:0; width:100%; height:100%; z-index:0; }

  .wrap{
    position:relative; z-index:2;
    max-width:520px;
    margin:0 auto;
    padding: 6vh 5vw 8vh 5vw;
    min-height:100dvh;
  }

  header{
    text-align:center;
    margin-bottom: 2rem;
  }
  .eyebrow{
    font-size:.8rem;
    letter-spacing:.3em;
    text-transform:uppercase;
    color:var(--rose);
    opacity:.85;
  }
  h1{
    font-family:'Playfair Display', serif;
    font-style:italic;
    font-weight:600;
    font-size:clamp(1.8rem, 7vw, 2.6rem);
    margin:.3rem 0 0 0;
  }

  .person-badge{
    position:fixed;
    top:16px; right:16px;
    z-index:30;
    background: rgba(255,255,255,.1);
    border:1px solid rgba(255,255,255,.25);
    backdrop-filter: blur(4px);
    padding:.4rem .9rem;
    border-radius:999px;
    font-size:.8rem;
    font-weight:600;
    cursor:pointer;
    transition: border-color .3s ease, box-shadow .3s ease;
  }
  .person-badge.is-albieri{
    border-color: var(--rose);
    box-shadow: 0 0 12px rgba(143,224,255,.35);
  }
  .person-badge.is-tati{
    border-color: var(--red);
    box-shadow: 0 0 12px rgba(255,90,110,.35);
  }

  .card{
    background: rgba(255,255,255,.06);
    border:1px solid rgba(255,255,255,.14);
    backdrop-filter: blur(6px);
    border-radius: 22px;
    padding: 1.4rem;
    margin-bottom:1.4rem;
  }

  .card h2{
    font-family:'Playfair Display', serif;
    font-style:italic;
    font-size:1.3rem;
    margin:0 0 1rem 0;
  }

  .wheel-list{
    display:flex;
    flex-direction:column;
    gap:.7rem;
  }
  .wheel-item{
    display:flex;
    align-items:center;
    justify-content:space-between;
    gap:.6rem;
    background: rgba(255,255,255,.05);
    border:1px solid rgba(255,255,255,.1);
    border-radius:14px;
    padding:.85rem 1rem;
    cursor:pointer;
    transition: transform .15s ease, background .15s ease;
  }
  .wheel-item:hover{ background: rgba(255,255,255,.1); transform: translateY(-1px); }
  .wheel-item .name{ font-weight:700; }
  .wheel-item .count{ font-size:.78rem; color:var(--rose); opacity:.9; }

  button{
    font-family:'Quicksand', sans-serif;
    font-weight:700;
    border:none;
    cursor:pointer;
    border-radius:999px;
  }
  .btn-gold{
    background: linear-gradient(135deg, var(--gold), #ffe9a8);
    color:#3a2600;
    padding:.85rem 1.6rem;
    font-size:1rem;
    box-shadow: 0 0 18px 2px rgba(245,185,66,.35);
    transition: transform .2s ease;
  }
  .btn-gold:hover{ transform: scale(1.04); }
  .btn-gold:active{ transform: scale(.97); }
  .btn-ghost{
    background: rgba(255,255,255,.08);
    color: var(--starlight);
    border:1px solid rgba(255,255,255,.22);
    padding:.7rem 1.3rem;
    font-size:.9rem;
  }

  input, textarea{
    width:100%;
    font-family:'Quicksand', sans-serif;
    font-size:.95rem;
    padding:.7rem .9rem;
    border-radius:12px;
    border:1px solid rgba(255,255,255,.22);
    background: rgba(255,255,255,.06);
    color: var(--starlight);
    margin-bottom:.7rem;
    resize:vertical;
  }
  input::placeholder, textarea::placeholder{ color: rgba(242,251,255,.5); }

  /* ---- rueda ---- */
  .wheel-stage{
    display:none;
  }
  .wheel-stage.active{ display:block; }

  .wheel-holder{
    position:relative;
    width: min(78vw, 320px);
    aspect-ratio: 1/1;
    margin: 0 auto 1.4rem auto;
  }
  #wheelCanvas{
    width:100%; height:100%;
    display:block;
    filter: drop-shadow(0 8px 24px rgba(0,0,0,.35));
  }
  .pointer{
    position:absolute;
    top:-6px; left:50%;
    transform: translateX(-50%);
    width:0; height:0;
    border-left:14px solid transparent;
    border-right:14px solid transparent;
    border-top:24px solid var(--gold);
    filter: drop-shadow(0 2px 4px rgba(0,0,0,.4));
    z-index:5;
  }
  .hub{
    position:absolute; inset:0;
    display:flex; align-items:center; justify-content:center;
    pointer-events:none;
  }
  .hub span{
    width:18%; aspect-ratio:1/1;
    border-radius:50%;
    background: radial-gradient(circle at 35% 30%, #fff, var(--gold) 70%);
    box-shadow: 0 0 12px rgba(245,185,66,.6);
  }

  .spin-row{
    display:flex;
    justify-content:center;
    gap:.8rem;
    margin-bottom:.4rem;
  }

  .back-link{
    display:inline-block;
    margin-bottom:1rem;
    font-size:.85rem;
    color:var(--rose);
    cursor:pointer;
    opacity:.9;
  }

  .history-list{
    display:flex;
    flex-direction:column;
    gap:.5rem;
    max-height: 220px;
    overflow-y:auto;
  }
  .history-item{
    display:flex;
    justify-content:space-between;
    gap:.6rem;
    font-size:.85rem;
    padding:.5rem .7rem;
    background: rgba(255,255,255,.05);
    border-radius:10px;
  }
  .history-item .who{ color:var(--rose); font-weight:700; }
  .history-item .when{ color: rgba(242,251,255,.55); font-size:.75rem; white-space:nowrap; }

  .empty-hint{
    font-size:.85rem;
    color: rgba(242,251,255,.6);
    text-align:center;
    padding: .6rem 0;
  }

  /* ---- resultado ---- */
  #resultOverlay{
    position:fixed; inset:0; z-index:40;
    display:flex; align-items:center; justify-content:center;
    padding: 8vw;
    text-align:center;
    background: var(--ink-deep);
    opacity:0; pointer-events:none;
    transition: opacity .5s ease;
  }
  #resultOverlay::before{
    content:'';
    position:absolute; inset:0;
    background: radial-gradient(ellipse at 50% 40%, rgba(245,185,66,.32), transparent 62%);
  }
  #resultOverlay.show{ opacity:1; pointer-events:all; }
  #resultOverlay > div{ position:relative; z-index:1; }
  #resultOverlay .tag{
    font-size:.85rem;
    letter-spacing:.3em;
    text-transform:uppercase;
    color: var(--rose);
    margin-bottom:.6rem;
  }
  #resultOverlay h2{
    font-family:'Playfair Display', serif;
    font-style:italic;
    font-weight:600;
    font-size:clamp(2rem,9vw,3.2rem);
    max-width:16ch;
    margin:0 auto;
    text-shadow: 0 0 40px rgba(245,185,66,.4);
  }

  /* ---- selector de persona ---- */
  #personModal{
    position:fixed; inset:0; z-index:50;
    display:flex; align-items:center; justify-content:center;
    background: rgba(6,42,68,.9);
    backdrop-filter: blur(4px);
  }
  #personModal .box{
    background: var(--ink-violet);
    border:1px solid rgba(255,255,255,.15);
    border-radius:20px;
    padding: 1.8rem 1.6rem;
    text-align:center;
    max-width:340px;
  }
  #personModal h2{
    font-family:'Playfair Display', serif;
    font-style:italic;
    font-size:1.4rem;
    margin:0 0 1rem 0;
  }
  .person-choices{
    display:flex;
    gap:.8rem;
    justify-content:center;
  }

  .heart-red{ color: var(--red); }
</style>
</head>
<body>

<canvas id="stars"></canvas>

<div class="person-badge" id="personBadge" title="Cambiar quién soy">👤 ...</div>

<div class="wrap">
  <header>
    <div class="eyebrow">Tati &amp; Albieri</div>
    <h1>El Decisor</h1>
  </header>

  <!-- LISTA DE RUEDAS -->
  <div id="listStage">
    <div class="card">
      <h2>Ruedas</h2>
      <div class="wheel-list" id="wheelList">
        <div class="empty-hint">Cargando...</div>
      </div>
    </div>

    <div class="card">
      <h2>Crear nueva rueda</h2>
      <input id="newWheelName" type="text" placeholder="Nombre (ej. Comida)">
      <textarea id="newWheelOptions" rows="3" placeholder="Opciones separadas por coma o por línea. Opcional: 'Pizza:3' para que salga más seguido"></textarea>
      <button class="btn-gold" id="createWheelBtn" style="width:100%;">Guardar rueda</button>
    </div>

    <div class="card">
      <h2>Historial reciente</h2>
      <div class="history-list" id="historyList">
        <div class="empty-hint">Aún no hay giros registrados</div>
      </div>
    </div>
  </div>

  <!-- PANTALLA DE RUEDA ACTIVA -->
  <div class="wheel-stage" id="wheelStage">
    <span class="back-link" id="backLink">&larr; volver a las ruedas</span>
    <div class="card">
      <h2 id="activeWheelName">—</h2>
      <div class="wheel-holder">
        <div class="pointer"></div>
        <canvas id="wheelCanvas" width="600" height="600"></canvas>
        <div class="hub"><span></span></div>
      </div>
      <div class="spin-row">
        <button class="btn-gold" id="spinBtn">Girar 🎡</button>
      </div>
      <div style="text-align:center; margin-top:.6rem;">
        <span class="back-link" id="statsToggle" style="margin-bottom:0;">Ver estadísticas 📊</span>
      </div>
      <div id="statsPanel" style="display:none; margin-top:.8rem;">
        <div class="history-list" id="statsList"></div>
      </div>
    </div>
  </div>
</div>

<!-- RESULTADO -->
<div id="resultOverlay">
  <div>
    <div class="tag">salió</div>
    <h2 id="resultText">—</h2>
    <p id="resultPhrase" style="color:#d6f2ff; margin-top:1rem; font-size:1rem;"></p>
  </div>
</div>

<!-- SELECTOR DE PERSONA -->
<div id="personModal">
  <div class="box">
    <h2>¿Quién eres? <span class="heart-red">❤️</span></h2>
    <div class="person-choices">
      <button class="btn-gold" data-person="Albieri">Albieri</button>
      <button class="btn-gold" data-person="Tati">Tati</button>
    </div>
  </div>
</div>

<script type="module">
  import { initializeApp } from "https://www.gstatic.com/firebasejs/12.16.0/firebase-app.js";
  import {
    getDatabase, ref, push, set, onValue, query, orderByChild, limitToLast, equalTo
  } from "https://www.gstatic.com/firebasejs/12.16.0/firebase-database.js";

  const firebaseConfig = {
    apiKey: "AIzaSyB0EvNWj7xEpgGYAVU2civ8F1CfcPWY6EA",
    authDomain: "el-decisor2.firebaseapp.com",
    databaseURL: "https://el-decisor2-default-rtdb.firebaseio.com",
    projectId: "el-decisor2",
    storageBucket: "el-decisor2.firebasestorage.app",
    messagingSenderId: "583925059254",
    appId: "1:583925059254:web:62eb2f7f7bb99a22536017"
  };

  const app = initializeApp(firebaseConfig);
  const db = getDatabase(app);

  // ---------- fondo de estrellas ----------
  const canvasStars = document.getElementById('stars');
  const ctxStars = canvasStars.getContext('2d');
  let stars = [];
  function resizeStars(){
    canvasStars.width = innerWidth;
    canvasStars.height = innerHeight;
    const count = Math.floor((innerWidth * innerHeight) / 9000);
    stars = Array.from({length: count}, () => ({
      x: Math.random()*canvasStars.width,
      y: Math.random()*canvasStars.height,
      r: Math.random()*1.4 + .3,
      phase: Math.random()*Math.PI*2,
      speed: Math.random()*.02 + .01
    }));
  }
  window.addEventListener('resize', resizeStars);
  resizeStars();
  function drawStars(t){
    ctxStars.clearRect(0,0,canvasStars.width,canvasStars.height);
    for(const s of stars){
      const tw = (Math.sin(t*s.speed + s.phase) + 1) / 2;
      ctxStars.globalAlpha = 0.25 + tw*0.75;
      ctxStars.fillStyle = '#f2fbff';
      ctxStars.beginPath();
      ctxStars.arc(s.x, s.y, s.r, 0, Math.PI*2);
      ctxStars.fill();
    }
    ctxStars.globalAlpha = 1;
    requestAnimationFrame(drawStars);
  }
  requestAnimationFrame(drawStars);

  // ---------- selector de persona ----------
  const personModal = document.getElementById('personModal');
  const personBadge = document.getElementById('personBadge');
  let currentPerson = localStorage.getItem('decisorPerson');

  function applyPersonBadge(){
    personBadge.textContent = currentPerson ? ('👤 ' + currentPerson) : '👤 ...';
    personBadge.classList.remove('is-albieri','is-tati');
    if(currentPerson === 'Albieri') personBadge.classList.add('is-albieri');
    if(currentPerson === 'Tati') personBadge.classList.add('is-tati');
  }

  if(currentPerson){
    personModal.style.display = 'none';
  }
  applyPersonBadge();

  document.querySelectorAll('#personModal [data-person]').forEach(btn=>{
    btn.addEventListener('click', ()=>{
      currentPerson = btn.dataset.person;
      localStorage.setItem('decisorPerson', currentPerson);
      applyPersonBadge();
      personModal.style.display = 'none';
    });
  });

  personBadge.addEventListener('click', ()=>{
    personModal.style.display = 'flex';
  });

  // ---------- estado ----------
  let wheelsData = {};
  let activeWheelId = null;
  let activeOptions = [];
  let currentRotation = 0;
  let spinning = false;

  const wheelList = document.getElementById('wheelList');
  const listStage = document.getElementById('listStage');
  const wheelStage = document.getElementById('wheelStage');
  const activeWheelName = document.getElementById('activeWheelName');
  const historyList = document.getElementById('historyList');

  // ---------- cargar ruedas ----------
  const wheelsRef = ref(db, 'wheels');
  let seeded = false;

  onValue(wheelsRef, (snapshot)=>{
    const val = snapshot.val();
    if(!val && !seeded){
      seeded = true;
      seedDefaults();
      return;
    }
    wheelsData = val || {};
    renderWheelList();
  });

  function seedDefaults(){
    const defaults = [
      { name: "Comida", options: ["Pizza","Sushi","Pollo a la brasa","Ceviche","Hamburguesa","Comida china"] },
      { name: "Plan de finde", options: ["Cine","Playa","Quedarnos en casa","Paseo al parque","Salir a comer"] }
    ];
    defaults.forEach(w=>{
      const newRef = push(wheelsRef);
      set(newRef, { name: w.name, options: w.options, createdAt: Date.now(), createdBy: "sistema" });
    });
  }

  function renderWheelList(){
    const ids = Object.keys(wheelsData);
    if(ids.length === 0){
      wheelList.innerHTML = '<div class="empty-hint">Aún no hay ruedas, crea la primera abajo</div>';
      return;
    }
    wheelList.innerHTML = '';
    ids.forEach(id=>{
      const w = wheelsData[id];
      const el = document.createElement('div');
      el.className = 'wheel-item';
      el.innerHTML = `<span class="name">${escapeHtml(w.name)}</span><span class="count">${(w.options||[]).length} opciones</span>`;
      el.addEventListener('click', ()=> openWheel(id));
      wheelList.appendChild(el);
    });
  }

  function escapeHtml(str){
    const d = document.createElement('div');
    d.textContent = str;
    return d.innerHTML;
  }

  // ---------- crear rueda ----------
  document.getElementById('createWheelBtn').addEventListener('click', ()=>{
    const nameInput = document.getElementById('newWheelName');
    const optionsInput = document.getElementById('newWheelOptions');
    const name = nameInput.value.trim();
    const options = optionsInput.value
      .split(/[,\n]/)
      .map(s=>s.trim())
      .filter(Boolean);

    if(!name || options.length < 2){
      alert('Ponle un nombre y al menos 2 opciones 🙂');
      return;
    }

    const newRef = push(wheelsRef);
    set(newRef, {
      name, options,
      createdAt: Date.now(),
      createdBy: currentPerson || 'anónimo'
    });

    nameInput.value = '';
    optionsInput.value = '';
  });

  // ---------- abrir / cerrar rueda ----------
  function openWheel(id){
    activeWheelId = id;
    activeOptions = wheelsData[id].options || [];
    activeWheelName.textContent = wheelsData[id].name;
    currentRotation = 0;
    document.getElementById('wheelCanvas').style.transition = 'none';
    document.getElementById('wheelCanvas').style.transform = 'rotate(0deg)';
    drawWheel(activeOptions);
    listStage.style.display = 'none';
    wheelStage.classList.add('active');
    document.getElementById('statsPanel').style.display = 'none';
    document.getElementById('statsToggle').textContent = 'Ver estadísticas 📊';
  }

  document.getElementById('backLink').addEventListener('click', ()=>{
    wheelStage.classList.remove('active');
    listStage.style.display = 'block';
  });

  // ---------- pesos: parsear "Opcion:peso" ----------
  function parseOption(raw){
    const idx = raw.lastIndexOf(':');
    if(idx > 0){
      const w = parseFloat(raw.slice(idx+1));
      if(!isNaN(w) && w > 0){
        return { label: raw.slice(0, idx).trim(), weight: w };
      }
    }
    return { label: raw.trim(), weight: 1 };
  }

  function getSegments(options){
    const parsed = options.map(parseOption);
    const total = parsed.reduce((s,p)=> s + p.weight, 0);
    let acc = 0;
    return parsed.map(p=>{
      const startDeg = (acc/total)*360;
      acc += p.weight;
      const endDeg = (acc/total)*360;
      return { label: p.label, weight: p.weight, startDeg, endDeg };
    });
  }

  // ---------- dibujar rueda ----------
  const palette = ['#3aa7d9', '#f5b942', '#0f5c8c', '#8fe0ff', '#ffd97a', '#1f7fae'];

  function drawWheel(options){
    const canvas = document.getElementById('wheelCanvas');
    const ctx = canvas.getContext('2d');
    const size = canvas.width;
    const cx = size/2, cy = size/2, r = size/2 - 6;
    const segments = getSegments(options);

    ctx.clearRect(0,0,size,size);

    segments.forEach((seg, i)=>{
      const start = -Math.PI/2 + seg.startDeg*Math.PI/180;
      const end = -Math.PI/2 + seg.endDeg*Math.PI/180;
      ctx.beginPath();
      ctx.moveTo(cx,cy);
      ctx.arc(cx,cy,r,start,end);
      ctx.closePath();
      ctx.fillStyle = palette[i % palette.length];
      ctx.fill();
      ctx.strokeStyle = 'rgba(255,255,255,.25)';
      ctx.lineWidth = 2;
      ctx.stroke();

      // texto
      ctx.save();
      ctx.translate(cx,cy);
      ctx.rotate((start+end)/2);
      ctx.textAlign = 'right';
      ctx.fillStyle = '#062a44';
      ctx.font = '600 ' + Math.max(13, size*0.03) + 'px Quicksand, sans-serif';
      const label = seg.label.length > 16 ? seg.label.slice(0,14)+'…' : seg.label;
      ctx.fillText(label, r - 18, 6);
      ctx.restore();
    });
  }

  // ---------- frases random al caer ----------
  const resultPhrases = [
    "¡El destino ha hablado! 🎉",
    "Nada de quejas, ya salió 😏",
    "¡Vamos con todo! 💙",
    "Esta vez no hay vuelta atrás 🦒",
    "La rueda nunca miente ✨",
    "Y así se decidió el universo",
    "Cero arrepentimientos permitidos 😄"
  ];

  // ---------- girar ----------
  document.getElementById('spinBtn').addEventListener('click', ()=>{
    if(spinning || activeOptions.length === 0) return;
    spinning = true;

    const segments = getSegments(activeOptions);
    const totalWeight = segments.reduce((s,seg)=> s + seg.weight, 0);
    let pick = Math.random()*totalWeight;
    let chosen = segments[segments.length-1];
    let cumulative = 0;
    for(const seg of segments){
      cumulative += seg.weight;
      if(pick <= cumulative){ chosen = seg; break; }
    }

    const segAngleSize = chosen.endDeg - chosen.startDeg;
    const center = (chosen.startDeg + chosen.endDeg)/2;

    const neededMod = (360 - center + 360) % 360;
    const currentMod = ((currentRotation % 360) + 360) % 360;
    const delta = ((neededMod - currentMod) + 360) % 360;
    const extraSpins = 4 + Math.floor(Math.random()*3); // 4 a 6 vueltas extra
    const jitter = (Math.random()-0.5) * (segAngleSize*0.6);

    currentRotation = currentRotation + delta + 360*extraSpins + jitter;

    const canvas = document.getElementById('wheelCanvas');
    canvas.style.transition = 'transform 3.2s cubic-bezier(.12,.72,.16,1)';
    canvas.style.transform = `rotate(${currentRotation}deg)`;

    setTimeout(()=>{
      spinning = false;
      showResult(chosen.label);
      recordSpin(chosen.label);
    }, 3250);
  });

  function showResult(text){
    const overlay = document.getElementById('resultOverlay');
    const resultText = document.getElementById('resultText');
    const resultPhrase = document.getElementById('resultPhrase');
    resultText.textContent = text;
    resultPhrase.textContent = resultPhrases[Math.floor(Math.random()*resultPhrases.length)];
    overlay.classList.add('show');
    setTimeout(()=>{
      overlay.classList.remove('show');
    }, 2200);
  }

  function recordSpin(result){
    const historyRef = ref(db, 'history');
    const newRef = push(historyRef);
    set(newRef, {
      wheelId: activeWheelId,
      wheelName: wheelsData[activeWheelId] ? wheelsData[activeWheelId].name : '',
      result,
      ts: Date.now(),
      by: currentPerson || 'anónimo'
    });
  }

  // ---------- estadísticas por rueda ----------
  const statsToggle = document.getElementById('statsToggle');
  const statsPanel = document.getElementById('statsPanel');
  const statsList = document.getElementById('statsList');

  statsToggle.addEventListener('click', ()=>{
    const willShow = statsPanel.style.display === 'none';
    statsPanel.style.display = willShow ? 'block' : 'none';
    statsToggle.textContent = willShow ? 'Ocultar estadísticas 📊' : 'Ver estadísticas 📊';
    if(willShow) loadStats();
  });

  function loadStats(){
    statsList.innerHTML = '<div class="empty-hint">Cargando...</div>';
    const statsQuery = query(ref(db, 'history'), orderByChild('wheelId'), equalTo(activeWheelId));
    onValue(statsQuery, (snapshot)=>{
      const val = snapshot.val();
      if(!val){
        statsList.innerHTML = '<div class="empty-hint">Aún no hay giros en esta rueda</div>';
        return;
      }
      const counts = {};
      Object.values(val).forEach(item=>{
        counts[item.result] = (counts[item.result] || 0) + 1;
      });
      const sorted = Object.entries(counts).sort((a,b)=> b[1]-a[1]);
      statsList.innerHTML = '';
      sorted.forEach(([label, count])=>{
        const el = document.createElement('div');
        el.className = 'history-item';
        el.innerHTML = `<span>${escapeHtml(label)}</span><span class="when">${count} ${count===1?'vez':'veces'}</span>`;
        statsList.appendChild(el);
      });
    }, { onlyOnce:true });
  }

  // ---------- historial en vivo ----------
  const historyQuery = query(ref(db, 'history'), orderByChild('ts'), limitToLast(10));
  onValue(historyQuery, (snapshot)=>{
    const val = snapshot.val();
    if(!val){
      historyList.innerHTML = '<div class="empty-hint">Aún no hay giros registrados</div>';
      return;
    }
    const items = Object.values(val).sort((a,b)=> b.ts - a.ts);
    historyList.innerHTML = '';
    items.forEach(item=>{
      const el = document.createElement('div');
      el.className = 'history-item';
      const when = new Date(item.ts).toLocaleString('es-PE', { day:'2-digit', month:'2-digit', hour:'2-digit', minute:'2-digit' });
      el.innerHTML = `<span><span class="who">${escapeHtml(item.by)}</span> · ${escapeHtml(item.wheelName)} → <strong>${escapeHtml(item.result)}</strong></span><span class="when">${when}</span>`;
      historyList.appendChild(el);
    });
  });
</script>

</body>
</html>
